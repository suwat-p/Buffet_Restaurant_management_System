<div class="login-container">
  
  <!-- Alert Modal Center Card -->
  <div class="alert-backdrop" *ngIf="showAlert">
    <div class="alert-card" [ngClass]="alertType">
      <div class="alert-icon">
        <mat-icon *ngIf="alertType === 'success'">check_circle</mat-icon>
        <mat-icon *ngIf="alertType === 'error'">error</mat-icon>
        <mat-icon *ngIf="alertType === 'warning'">warning</mat-icon>
      </div>
      <h3 class="alert-title">{{ alertTitle }}</h3>
      <p class="alert-message">{{ alertMessage }}</p>
    </div>
  </div>

  <div class="login-card">
    
    <!-- Loading Overlay -->
    <div class="card-loading-overlay" *ngIf="isLoading">
      <div class="spinner-lg"></div>
      <span>กำลังเข้าสู่ระบบพนักงาน...</span>
    </div>

    <!-- HEADER -->
    <div class="card-header">
      <div class="brand-logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="8.5" cy="7" r="4"></circle>
          <polyline points="17 11 19 13 23 9"></polyline>
        </svg>
      </div>
      <h2>เข้าสู่ระบบเพื่อเริ่มต้นใช้งาน</h2>
      <p class="subtitle">ระบบจัดการร้านอาหาร buffet <strong>(สำหรับพนักงาน)</strong></p>
    </div>

    <form (ngSubmit)="onLogin()">
      <!-- Phone Input -->
      <div class="form-group">
        <label for="phone">เบอร์โทรศัพท์</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">phone</mat-icon>
          <input 
            type="tel" 
            id="phone" 
            name="phone" 
            placeholder="08X-XXX-XXXX" 
            [(ngModel)]="phone" 
            [disabled]="isLoading"
          />
        </div>
      </div>

      <!-- Password Input -->
      <div class="form-group">
        <label for="password">รหัสผ่าน</label>
        <div class="input-wrapper">
          <mat-icon class="input-icon">lock</mat-icon>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="กรอกรหัสผ่าน" 
            [(ngModel)]="password" 
            [disabled]="isLoading"
          />
        </div>
      </div>

      <!-- Options -->
      <div class="options-wrapper">
        <div class="remember-me">
          <input type="checkbox" id="remember" name="remember" [(ngModel)]="rememberMe" [disabled]="isLoading" />
          <label for="remember">จดจำการเข้าสู่ระบบ</label>
        </div>
        <a (click)="forgotPassword()" class="forgot-pass">ลืมรหัสผ่าน?</a>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-login" [disabled]="isLoading">
        <span *ngIf="isLoading" class="spinner-sm"></span>
        <span>{{ isLoading ? 'กำลังเข้าสู่ระบบ...' : 'เข้าสู่ระบบ (Login)' }}</span>
      </button>

      <div class="divider">
        <span>หรือ</span>
      </div>

      <!-- Register Buttons -->
      <button type="button" class="btn-register-customer" (click)="onRegisterMember()" [disabled]="isLoading">
        สมัครสมาชิก (สำหรับ ลูกค้า)
      </button>

      <button type="button" class="btn-register-staff" (click)="onRegisterEmployee()" [disabled]="isLoading">
        สมัครสมาชิก (สำหรับ พนักงาน)
      </button>
    </form>
    
  </div>
</div>
