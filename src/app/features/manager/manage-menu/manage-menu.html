<p-toast position="bottom-center"></p-toast>
<p-confirmDialog
  [style]="{ width: '450px', maxWidth: '92vw' }"
  [breakpoints]="{ '640px': '92vw' }"
  styleClass="dark-dialog"
></p-confirmDialog>

<app-menu-manager>
  <div class="page-container">
    <div class="content-wrapper">
      <div class="header-action">
        <h2 class="section-header">จัดการเมนูอาหาร (Admin)</h2>

        <div class="action-right">
          <span class="p-input-icon-left search-wrapper">
            <i class="pi pi-search"></i>
            <input
              pInputText
              type="text"
              (input)="dt.filterGlobal($any($event.target).value, 'contains')"
              placeholder="ค้นหาชื่อ, หมวดหมู่..."
              class="dark-input"
            />
          </span>
          <button
            pButton
            pRipple
            label="เพิ่มเมนูใหม่"
            icon="pi pi-plus"
            class="add-btn"
            (click)="openNew()"
          ></button>
        </div>
      </div>

      <div class="table-card">
        <p-table
          #dt
          [value]="menus"
          [rows]="10"
          [paginator]="true"
          [globalFilterFields]="['menu_Name', 'category', 'menu_Type']"
          responsiveLayout="scroll"
          styleClass="p-datatable-dark"
        >
          <ng-template pTemplate="header">
            <tr>
              <th>รูปภาพ</th>
              <th pSortableColumn="menu_Name">
                ชื่อเมนู <p-sortIcon field="menu_Name"></p-sortIcon>
              </th>
              <th pSortableColumn="category">
                หมวดหมู่ <p-sortIcon field="category"></p-sortIcon>
              </th>
              <th pSortableColumn="menu_Type">
                ประเภท <p-sortIcon field="menu_Type"></p-sortIcon>
              </th>
              <th pSortableColumn="price">ราคา <p-sortIcon field="price"></p-sortIcon></th>
              <th class="text-center">จัดการ</th>
            </tr>
          </ng-template>
          <ng-template pTemplate="body" let-menu>
            <tr>
              <td>
                <img [src]="menu.menu_Image" class="menu-thumb" />
              </td>
              <td>{{ menu.menu_Name }}</td>
              <td>
                <span class="badge category-badge">{{ menu.category }}</span>
              </td>
              <td>{{ menu.menu_Type }}</td>
              <td class="price-text">
                <span *ngIf="menu.price && menu.price > 0">{{ menu.price | number }} ฿</span>
                <span *ngIf="!menu.price || menu.price === 0" class="buffet-label">บุฟเฟต์</span>
              </td>
              <td class="text-center">
                <button
                  pButton
                  pRipple
                  icon="pi pi-pencil"
                  class="p-button-rounded p-button-warning action-btn mr-2"
                  (click)="editMenu(menu)"
                ></button>
              </td>
            </tr>
          </ng-template>
          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="6" class="text-center p-4">ไม่พบข้อมูลเมนูอาหาร</td>
            </tr>
          </ng-template>
        </p-table>
      </div>
    </div>
  </div>
</app-menu-manager>

<p-dialog
  [(visible)]="menuDialog"
  [style]="{ width: '480px', maxWidth: '92vw' }"
  [breakpoints]="{ '768px': '90vw', '480px': '95vw' }"
  header="รายละเอียดเมนู"
  [modal]="true"
  styleClass="dark-dialog p-fluid"
  [draggable]="false"
>
  <ng-template pTemplate="content">
    <div class="field">
      <label for="name">ชื่อเมนู</label>
      <input
        type="text"
        pInputText
        id="name"
        [(ngModel)]="menu.menu_Name"
        placeholder="เช่น หมูสไลด์, ชาต้ม"
        required
        autofocus
        class="dark-input"
      />
      <small class="p-error" *ngIf="!menu.menu_Name">จำเป็นต้องระบุชื่อเมนู</small>
    </div>

    <div class="formgrid grid">
      <div class="field col-6">
        <label for="category">หมวดหมู่ (Category)</label>
        <p-select
          inputId="category"
          [options]="categorySelectItems"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="selectedCategory"
          appendTo="body"
          placeholder="-- เลือกหมวดหมู่ --"
          [filter]="true"
          filterPlaceholder="ค้นหา..."
          class="dark-dropdown w-full"
          panelStyleClass="dark-dropdown-panel"
        ></p-select>
        <input
          *ngIf="selectedCategory === OTHER_VALUE"
          type="text"
          pInputText
          [(ngModel)]="customCategory"
          placeholder="ระบุหมวดหมู่ใหม่"
          class="dark-input other-input"
        />
      </div>

      <div class="field col-6">
        <label for="type">ประเภท (Type)</label>
        <p-select
          inputId="type"
          [options]="typeSelectItems"
          optionLabel="label"
          optionValue="value"
          [(ngModel)]="selectedType"
          (onChange)="onTypeChange()"
          appendTo="body"
          placeholder="-- เลือกประเภท --"
          [filter]="true"
          filterPlaceholder="ค้นหา..."
          class="dark-dropdown w-full"
          panelStyleClass="dark-dropdown-panel"
        ></p-select>
        <input
          *ngIf="selectedType === OTHER_VALUE"
          type="text"
          pInputText
          [(ngModel)]="customType"
          (ngModelChange)="onTypeChange()"
          placeholder="ระบุประเภทใหม่"
          class="dark-input other-input"
        />
      </div>
    </div>

    <!-- ซ่อนแบบ CSS ไม่กระตุกหรือเด้งหนี -->
    <div class="field price-container" [class.hidden-price]="!showPriceField">
      <label for="price">ราคา</label>
      <p-inputNumber
        id="price"
        [(ngModel)]="menu.price"
        (onInput)="onPriceInput($event)"
        mode="currency"
        currency="THB"
        locale="th-TH"
        [min]="1"
        placeholder="กรอกราคา (บาท)"
        styleClass="dark-input-num"
      ></p-inputNumber>
      <small class="p-error" *ngIf="showPriceField && (!menu.price || menu.price < 1)">
        ราคาต้องมากกว่า 0 บาท (ขั้นต่ำ 1 บาท)
      </small>
    </div>

    <div class="field">
      <label for="image">อัปโหลดรูปภาพ</label>
      <input
        type="file"
        id="image"
        (change)="onFileSelected($event)"
        accept="image/*"
        class="dark-input file-input"
      />
      <div *ngIf="imagePreview" class="image-preview-box">
        <button type="button" class="remove-image-btn" title="ลบรูปภาพ" (click)="clearImage()">
          <i class="pi pi-times"></i>
        </button>
        <img [src]="imagePreview" alt="Preview" class="image-preview" />
      </div>
    </div>
  </ng-template>

  <ng-template pTemplate="footer">
    <button
      pButton
      pRipple
      label="ยกเลิก"
      icon="pi pi-times"
      class="p-button-text cancel-btn"
      (click)="hideDialog()"
    ></button>
    <button
      pButton
      pRipple
      label="บันทึก"
      icon="pi pi-check"
      class="save-btn"
      (click)="saveMenu()"
      [disabled]="!menu.menu_Name"
    ></button>
  </ng-template>
</p-dialog>
