<div class="serve-page">
  <div class="card" *ngIf="state === 'ready' || state === 'submitting'">
    <mat-icon class="icon">restaurant</mat-icon>
    <h1>ยืนยันนำเสิร์ฟ</h1>
    <p class="sub">ออเดอร์ #{{ orderId }}</p>

    <button class="confirm-btn" [disabled]="state === 'submitting'" (click)="confirmServe()">
      {{ state === 'submitting' ? 'กำลังบันทึก...' : 'ยืนยันนำเสิร์ฟ' }}
    </button>
  </div>

  <div class="card" *ngIf="state === 'loading'">
    <p>กำลังโหลด...</p>
  </div>

  <div class="card success" *ngIf="state === 'success'">
    <mat-icon class="icon">check_circle</mat-icon>
    <h1>สำเร็จ!</h1>
    <p class="sub">เปลี่ยนสถานะเป็น "กำลังนำเสิร์ฟ" เรียบร้อยแล้ว</p>
  </div>

  <div class="card error" *ngIf="state === 'error'">
    <mat-icon class="icon">error</mat-icon>
    <h1>ทำรายการไม่สำเร็จ</h1>
    <p class="sub">{{ errorMessage }}</p>
    <button class="confirm-btn" (click)="confirmServe()">ลองอีกครั้ง</button>
  </div>

  <div class="card error" *ngIf="state === 'invalid'">
    <mat-icon class="icon">error</mat-icon>
    <h1>ลิงก์ไม่ถูกต้อง</h1>
    <p class="sub">ไม่พบหมายเลขออเดอร์ กรุณาสแกน QR ใหม่อีกครั้ง</p>
  </div>
</div>
