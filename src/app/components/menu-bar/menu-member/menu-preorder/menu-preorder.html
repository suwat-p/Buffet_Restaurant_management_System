<aside class="sidebar" [class.expanded]="isSidebarOpen">
  <div class="sidebar-header">
    <div class="brand-info">
      <img src="assets/Images/Logo.png" alt="Logo" class="logo" />
      <span class="brand-name" *ngIf="isSidebarOpen">BUFFET</span>
    </div>
    <button class="close-btn" *ngIf="isSidebarOpen" (click)="toggleSidebar.emit()">
      <i class="pi pi-times"></i>
    </button>
  </div>

  <div class="table-badge" *ngIf="isSidebarOpen && bookingId">
    <i class="pi pi-bookmark"></i>
    <span>การจอง #{{ bookingId }}</span>
  </div>

  <ul class="nav-menu">
    <li
      class="menu-item"
      [class.active]="activeView === 'menu'"
      [title]="!isSidebarOpen ? 'รายการเมนูอาหาร' : ''"
      (click)="onMenuClick()"
    >
      <i class="pi pi-list"></i>
      <span *ngIf="isSidebarOpen">รายการเมนูอาหาร</span>
    </li>
    <li
      class="menu-item"
      [title]="!isSidebarOpen ? 'สั่งอาหาร/ตะกร้าของคุณ' : ''"
      (click)="onCartClick()"
    >
      <i class="pi pi-shopping-cart"></i>
      <span *ngIf="isSidebarOpen">สั่งอาหาร/ตะกร้าของคุณ</span>
      <span class="badge" *ngIf="cartBadgeCount > 0">{{ cartBadgeCount }}</span>
    </li>
    <li
      class="menu-item"
      [class.active]="activeView === 'status'"
      [title]="!isSidebarOpen ? 'ติดตามสถานะออเดอร์' : ''"
      (click)="onOrderStatusClick()"
    >
      <i class="pi pi-receipt"></i>
      <span *ngIf="isSidebarOpen">ติดตามสถานะออเดอร์</span>
    </li>
  </ul>
</aside>

<div class="sidebar-backdrop" *ngIf="isSidebarOpen" (click)="toggleSidebar.emit()"></div>
